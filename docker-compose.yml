services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: livroai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/app/cred/hybrid-cabinet-485920-a4-e0569960d34e.json
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
      - easyocr_cache:/root/.EasyOCR        # cache dos modelos do easyocr
      - hf_cache:/root/.cache/huggingface   # cache do modelo YOLO
    command: uvicorn app.core.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livroai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped

volumes:
  pip_cache:
  node_modules:
  easyocr_cache:    # persiste modelos do easyocr entre restarts
  hf_cache:         # persiste modelo YOLO entre restarts